<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>4 en Raya 4x4 - Estructura Árbol Binario</title>
    <link rel="stylesheet" href="/static/css/style.css">
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
</head>
<body>
    <div class="container">
        <header>
            <h1>4 en Raya <i>Tradicional</i></h1>
            <p>Estructura de datos: Árbol Binario de Búsqueda (ClaseNodo y ArbolBinario)</p>
        </header>

        <div class="controls">
            <select id="mode-select">
                <option value="minimax">Árbol Binario - Minimax Tradicional (Búsqueda Completa)</option>
                <option value="alphabeta">Árbol Binario - Minimax con Poda Alfa-Beta</option>
            </select>
            <button id="reset-btn" class="btn">Reiniciar Partida</button>
        </div>

        <div class="main-content">
            <div class="board-container">
                <div id="board" class="board">
                    <!-- 16 celdas -->
                </div>
                <div id="status-message" class="status-message">Tu turno (Rojo)</div>
            </div>
        </div>
    </div>
    
    <script src="/static/js/main.js"></script>
</body>
</html>
